services:
  - type: web
    name: recoverai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: EXECUTION__RAZORPAY_PROVIDER_TYPE
        sync: false
      - key: EXECUTION__RAZORPAY_KEY_ID
        sync: false
      - key: EXECUTION__RAZORPAY_KEY_SECRET
        sync: false
